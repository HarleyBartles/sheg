name: Sheg CI

on:
  pull_request:
    branches: [develop, main, 'release/**']
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

jobs:
  verify:
    name: sheg-verify
    runs-on: ubuntu-latest
    steps:
      - name: Enforce pull request target routing
        if: github.event.pull_request.base.ref == 'main'
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$SOURCE_BRANCH" in
            release/*|hotfix/*) ;;
            *) echo "Pull requests to main must come from release/* or hotfix/* branches." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify

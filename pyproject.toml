[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "system-one-polling"
version = "0.1.0"
description = "Bounded simulated-reader studies with Jev and local System One providers"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "openrouter==1.2.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
